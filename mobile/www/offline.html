<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lyncei · You're offline</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#16141F;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
  @media (prefers-color-scheme:dark){body{background:#0B0D10;color:#F3F4F6}.sub{color:#8B95A3!important}button{background:#F3F4F6!important;color:#0B0D10!important}}
  .box{max-width:340px;text-align:center;display:grid;justify-items:center;gap:14px}
  h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:8px 0 0}
  .sub{color:#6B7280;margin:0;font-size:16px;line-height:1.5}
  button{margin-top:8px;border:0;border-radius:4px;background:#16141F;color:#fff;font:inherit;font-weight:600;font-size:16px;padding:14px 28px}
</style>
</head>
<body>
<div class="box">
  <svg width="56" height="56" viewBox="0 0 100 100" fill="none" stroke-linecap="round" aria-hidden="true"><circle cx="46" cy="46" r="30" stroke="currentColor" stroke-width="10"/><circle cx="46" cy="46" r="9" fill="currentColor"/><path d="M66 66l18 18" stroke="#C8401F" stroke-width="10"/></svg>
  <h1>You're offline</h1>
  <p class="sub">Lyncei needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
  <button type="button" onclick="location.href='https://lyncei.com/'">Try again</button>
</div>
</body>
</html>
