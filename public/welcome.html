<style>
@font-face{font-family:"DM Sans";src:url(/fonts/dm-sans-var.woff2) format("woff2");font-weight:100 1000;font-display:swap}
:root{
  --bg:#000000; --ink:#F5F5F7; --muted:#8A9099; --faint:#4A4F57; --blue:#4F86F7;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:6px}

.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  padding:max(22px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}

.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);opacity:.92;justify-self:start}
.brand svg{width:26px;height:26px;display:block}
.brand span{font-weight:500;font-size:19px;letter-spacing:-.02em}

.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(32px,6vh,60px);text-align:center;padding-block:clamp(20px,4vh,48px)}
.orb{display:block;height:clamp(280px,50vh,600px);width:auto;max-width:72vw;object-fit:contain}
.line{margin:0;font-weight:400;font-size:clamp(24px,3.4vw,40px);line-height:1.15;letter-spacing:-.025em;max-width:20ch;text-wrap:balance}
.whisper{margin:14px 0 0;color:var(--muted);font-size:clamp(14px,1.3vw,16px);letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}

.foot{display:flex;justify-content:center;color:var(--faint);font-size:12px;letter-spacing:.04em}

@media (prefers-reduced-motion: no-preference){
  .orb{animation:breathe 10s ease-in-out infinite, rise 2.4s cubic-bezier(.2,.7,.2,1) both}
  .line{animation:appear 2.2s ease .9s both}
  .whisper{animation:appear 2.6s ease 3.2s both}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @keyframes rise{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:blur(0)}}
  @keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="page">
  <a class="brand" href="/" aria-label="Lyncei">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="46" cy="46" r="30" stroke="currentColor" stroke-width="10" fill="none"/><circle cx="46" cy="46" r="9" fill="currentColor"/><path d="M66 66l18 18" stroke="#4F86F7" stroke-width="10" stroke-linecap="round" fill="none"/></svg>
    <span>Lyncei</span>
  </a>

  <main class="stage">
    <img class="orb" src="/img/lyncei-orb.webp" width="930" height="1704" alt="" fetchpriority="high" decoding="async">
    <div>
      <h1 class="line">Science is about to change who it trusts.</h1>
      <p class="whisper">Look closer</p>
    </div>
  </main>

  <footer class="foot">© 2026 Lyncei</footer>
</div>
</body>
